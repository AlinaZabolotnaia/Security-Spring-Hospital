spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=alina-korsakova
# ddl-auto вместо устаревшего spring.jpa.generate-ddl — Hibernate сам создаёт/обновляет схему с PK
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.freemarker.expose-request-attributes=true
spring.freemarker.expose-session-attributes=true

# Session timeout
server.servlet.session.timeout=15m

# Admin credentials — override via env variables in production:
#   ADMIN_USERNAME=admin ADMIN_PASSWORD=<strong-password>
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Hospital2024!}

